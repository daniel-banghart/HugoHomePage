<!doctype html>
<html>
<head>
 <meta charset="utf-8">
 <title>{{ .Page.Title }}</title>
 {{ with resources.Get "sass/main.scss" }}
   {{ $style := . | toCSS | resources.Minify }}
   <link rel="stylesheet" href="{{ $style.Permalink }}">
 {{ else }}
   {{ errorf "Unable to find assets/sass/main.scss" }}
 {{ end }}
</head>

<body>
 {{ block "main" . }}
 {{ end }}
</body>
</html>
